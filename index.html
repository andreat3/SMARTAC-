<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMARTAC - Navigatore Tachimetro ESP32</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; max-width: 420px; margin: 15px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; color: #38bdf8; }
    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    .btn-ble { background: #0284c7; color: white; }
    .btn-nav { background: #16a34a; color: white; }
    .btn-stop { background: #dc2626; color: white; }
    input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; }
    #stato-ble { color: #94a3b8; font-size: 14px; margin-top: 10px; font-weight: 500; }
    .connesso { color: #4ade80 !important; }
    #info-svolta { font-size: 18px; font-weight: bold; color: #facc15; margin-top: 15px; min-height: 24px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>SMARTAC Tachimetro</h2>
    <button class="btn-ble" onclick="connettiBLE()">1. Connetti Bluetooth</button>
    <div id="stato-ble">Stato: Disconnesso</div>
  </div>

  <div class="card">
    <input type="text" id="destinazione" placeholder="Indirizzo (es. Modena, Piazza Grande)">
    <button class="btn-nav" onclick="avviaNavigazione()">2. Calcola e Avvia</button>
    <button class="btn-stop" onclick="fermaNavigazione()">Ferma Navigazione</button>
    <div id="info-svolta">In attesa di percorso...</div>
  </div>

  <script>
    // UUID Standard Nordic UART Service (5 blocchi completi)
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    let rxChar = null;
    let watchId = null;
    let passiPercorso = [];
    let indicePasso = 0;

    async function connettiBLE() {
      const statoEl = document.getElementById('stato-ble');
      try {
        statoEl.innerText = 'Ricerca dispositivo...';
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }]
        });

        device.addEventListener('gattserverdisconnected', () => {
          rxChar = null;
          statoEl.classList.remove('connesso');
          statoEl.innerText = 'Stato: Disconnesso';
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(RX_UUID);

        statoEl.classList.add('connesso');
        statoEl.innerText = 'Connesso a: ' + device.name;
      } catch (e) {
        statoEl.classList.remove('connesso');
        statoEl.innerText = 'Errore: ' + e.message;
      }
    }

    async function inviaESP32(stringa) {
      if (!rxChar) return;
      try {
        const data = new TextEncoder().encode(stringa + '\n');
        await rxChar.writeValueWithoutResponse(data);
      } catch (e) {
        try {
          const data = new TextEncoder().encode(stringa + '\n');
          await rxChar.writeValue(data);
        } catch (err) {
          console.error('Errore invio BLE:', err);
        }
      }
    }

    function distanzaMetri(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function avviaNavigazione() {
      const query = document.getElementById('destinazione').value;
      const infoEl = document.getElementById('info-svolta');
      if (!query) return alert('Inserisci una destinazione!');

      infoEl.innerText = 'Acquisizione GPS...';

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const startLat = pos.coords.latitude;
        const startLon = pos.coords.longitude;

        infoEl.innerText = 'Ricerca indirizzo...';
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const geoData = await geoRes.json();
        if (!geoData.length) {
          infoEl.innerText = 'Indirizzo non trovato!';
          return;
        }

        const endLat = geoData[0].lat;
        const endLon = geoData[0].lon;

        infoEl.innerText = 'Calcolo percorso...';
        const routeRes = await fetch(`https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${endLon},${endLat}?steps=true&overview=false`);
        const routeData = await routeRes.json();

        if (routeData.code !== 'Ok') {
          infoEl.innerText = 'Percorso non calcolabile';
          return;
        }

        passiPercorso = routeData.routes[0].legs[0].steps;
        indicePasso = 1;

        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(aggiornaGuida, err => console.error(err), {
          enableHighAccuracy: true,
          maximumAge: 1000
        });

      }, () => {
        infoEl.innerText = 'Attiva il GPS del telefono!';
      }, { enableHighAccuracy: true });
    }

    function aggiornaGuida(pos) {
      const infoEl = document.getElementById('info-svolta');
      if (indicePasso >= passiPercorso.length) {
        infoEl.innerText = 'Sei arrivato a destinazione!';
        inviaESP32('0 m|arrive|Arrivo a destinazione');
        fermaNavigazione();
        return;
      }

      const passo = passiPercorso[indicePasso];
      const targetLon = passo.maneuver.location[0];
      const targetLat = passo.maneuver.location[1];
      const dist = Math.round(distanzaMetri(pos.coords.latitude, pos.coords.longitude, targetLat, targetLon));

      if (dist < 25 && indicePasso < passiPercorso.length - 1) {
        indicePasso++;
        return aggiornaGuida(pos);
      }

      const direzione = passo.maneuver.modifier || passo.maneuver.type || 'straight';
      const via = passo.name || 'Prosegui';
      const distTesto = dist >= 1000 ? (dist / 1000).toFixed(1) + ' km' : dist + ' m';

      infoEl.innerText = `${distTesto} • ${direzione} (${via})`;
      inviaESP32(`${distTesto}|${direzione}|${via}`);
    }

    function fermaNavigazione() {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      inviaESP32('STOP||');
      document.getElementById('info-svolta').innerText = 'Navigazione fermata';
    }
  </script>
</body>
</html>
