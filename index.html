<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigatore Tachimetro ESP32</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      max-width: 420px;
      margin: 15px auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-ble { background: #0284c7; color: white; }
    .btn-nav { background: #16a34a; color: white; }
    .btn-stop { background: #dc2626; color: white; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
    }
    #stato-ble {
      color: #38bdf8;
      font-size: 14px;
      margin-top: 10px;
      font-weight: 500;
    }
    #info-svolta {
      font-size: 18px;
      font-weight: bold;
      color: #4ade80;
      margin-top: 15px;
      min-height: 24px;
    }
    .nota {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Tachimetro Smart ESP32</h2>
    <button class="btn-ble" onclick="connettiBLE()">1. Connetti Bluetooth</button>
    <div id="stato-ble">Stato: Disconnesso</div>
    <div class="nota">Assicurati di usare Google Chrome con Bluetooth e GPS attivi.</div>
  </div>

  <div class="card">
    <input type="text" id="destinazione" placeholder="Indirizzo (es. Modena, Piazza Grande)">
    <button class="btn-nav" onclick="avviaNavigazione()">2. Calcola e Avvia</button>
    <button class="btn-stop" onclick="fermaNavigazione()">Ferma Navigazione</button>
    <div id="info-svolta">In attesa di percorso...</div>
  </div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

    let rxChar = null;
    let watchId = null;
    let passiPercorso = [];
    let indicePasso = 0;

    async function connettiBLE() {
      if (!navigator.bluetooth) {
        alert('Il tuo browser non supporta Web Bluetooth. Usa Google Chrome su Android.');
        return;
      }
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }]
        });
        device.addEventListener('gattserverdisconnected', () => {
          document.getElementById('stato-ble').innerText = 'Stato: Disconnesso';
          rxChar = null;
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(RX_UUID);
        document.getElementById('stato-ble').innerText = 'Connesso a: ' + (device.name || 'Tachimetro ESP32');
      } catch (e) {
        alert('Errore Bluetooth: ' + e.message);
      }
    }

    async function inviaESP32(stringa) {
      if (!rxChar) return;
      try {
        const data = new TextEncoder().encode(stringa + '\n');
        await rxChar.writeValue(data);
      } catch (e) {
        console.error('Errore invio BLE:', e);
      }
    }

    function distanzaMetri(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180;
      const dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function avviaNavigazione() {
      const query = document.getElementById('destinazione').value.trim();
      if (!query) {
        alert('Inserisci una destinazione!');
        return;
      }

      document.getElementById('info-svolta').innerText = 'Ricerca posizione GPS...';

      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const startLat = pos.coords.latitude;
          const startLon = pos.coords.longitude;

          document.getElementById('info-svolta').innerText = 'Ricerca indirizzo...';
          const geoRes = await fetch(
            'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=1'
          );
          const geoData = await geoRes.json();
          if (!geoData || geoData.length === 0) {
            document.getElementById('info-svolta').innerText = 'Indirizzo non trovato!';
            return;
          }

          const endLat = geoData[0].lat;
          const endLon = geoData[0].lon;

          document.getElementById('info-svolta').innerText = 'Calcolo percorso...';
          const routeRes = await fetch(
            `https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${endLon},${endLat}?steps=true&overview=false`
          );
          const routeData = await routeRes.json();

          if (routeData.code !== 'Ok' || !routeData.routes || !routeData.routes[0]) {
            document.getElementById('info-svolta').innerText = 'Percorso non calcolabile';
            return;
          }

          passiPercorso = routeData.routes[0].legs[0].steps;
          indicePasso = passiPercorso.length > 1 ? 1 : 0;

          if (watchId !== null) navigator.geolocation.clearWatch(watchId);
          watchId = navigator.geolocation.watchPosition(
            aggiornaGuida,
            (err) => console.error('Errore GPS:', err),
            { enableHighAccuracy: true, maximumAge: 1000 }
          );
        } catch (err) {
          document.getElementById('info-svolta').innerText = 'Errore di rete durante il calcolo';
          console.error(err);
        }
      }, () => {
        alert('Attiva il GPS del telefono e consenti la posizione!');
        document.getElementById('info-svolta').innerText = 'GPS non attivo';
      }, { enableHighAccuracy: true });
    }

    function aggiornaGuida(pos) {
      if (indicePasso >= passiPercorso.length) {
        document.getElementById('info-svolta').innerText = 'Sei arrivato a destinazione!';
        inviaESP32('0 m|arrive|Arrivo a destinazione');
        fermaNavigazione(false);
        return;
      }

      const passo = passiPercorso[indicePasso];
      const targetLon = passo.maneuver.location[0];
      const targetLat = passo.maneuver.location[1];
      const dist = Math.round(distanzaMetri(pos.coords.latitude, pos.coords.longitude, targetLat, targetLon));

      if (dist < 25 && indicePasso < passiPercorso.length - 1) {
        indicePasso++;
        aggiornaGuida(pos);
        return;
      }

      const direzione = passo.maneuver.modifier || passo.maneuver.type || 'straight';
      const via = passo.name || 'Prosegui';
      const distTesto = dist >= 1000 ? (dist / 1000).toFixed(1) + ' km' : dist + ' m';

      document.getElementById('info-svolta').innerText = `${distTesto} | ${direzione} | ${via}`;
      inviaESP32(`${distTesto}|${direzione}|${via}`);
    }

    function fermaNavigazione(inviaStop = true) {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      if (inviaStop) {
        inviaESP32('STOP||');
        document.getElementById('info-svolta').innerText = 'Navigazione fermata';
      }
    }
  </script>
</body>
</html>
